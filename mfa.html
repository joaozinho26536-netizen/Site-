<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramos de Oliveira &middot; Verificação em duas etapas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Roboto+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/open-props.min.css">
<link rel="icon" href="assets/img/favicon.png?v=1" type="image/png">
<link rel="apple-touch-icon" href="assets/img/favicon.png?v=1">
<link rel="stylesheet" href="assets/style.css?v=2">
</head><body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <img class="auth-logo-icon" src="assets/img/logo-icon-green.png?v=1" alt="Ramos de Oliveira">
      <div class="auth-title">Verificação em duas etapas</div>
      <div class="brand-sub">Ramos de Oliveira &middot; Sistema</div>
    </div>
    <div id="mfa-error"></div>
    <p style="font-size:13px; color:var(--muted); margin:0 0 16px;">Digite o código de 6 dígitos gerado pelo seu aplicativo autenticador (Google Authenticator, Authy, etc).</p>
    <form id="form-mfa">
      <div class="field"><label>Código</label><input id="mfa-code" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required autofocus></div>
      <button type="submit" class="btn primary" id="mfa-submit">Verificar</button>
    </form>
    <div style="text-align:center; margin-top:16px;">
      <button type="button" id="mfa-logout" class="btn ghost" style="font-size:12.5px; color:var(--muted);">Não tenho acesso ao app &middot; sair</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js?v=2"></script>
<script src="assets/nav.js?v=2"></script>
<script>
(async function(){
  const { data: { session } } = await RO.sb.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }
  const { data: aal } = await RO.sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(!aal || aal.nextLevel !== 'aal2' || aal.nextLevel === aal.currentLevel){
    // Nada para desafiar (sem 2FA ativado, ou já verificado) — segue direto.
    window.location.href = 'index.html';
    return;
  }

  const errBox = document.getElementById('mfa-error');
  function setError(msg){
    errBox.innerHTML = msg ? `<div class="alertbox danger">${RO_NAV.ICONS.warn}<div>${RO.esc(msg)}</div></div>` : '';
  }

  const params = new URLSearchParams(location.search);
  const next = params.get('next') || 'index.html';

  document.getElementById('mfa-logout').onclick = ()=> RO.logout();

  document.getElementById('form-mfa').addEventListener('submit', async (e)=>{
    e.preventDefault();
    setError('');
    const code = document.getElementById('mfa-code').value.trim();
    const btn = document.getElementById('mfa-submit');
    btn.disabled = true; btn.textContent = 'Verificando…';
    try{
      const { data: factors, error: eList } = await RO.sb.auth.mfa.listFactors();
      if(eList) throw eList;
      const factor = (factors.totp||[])[0];
      if(!factor) throw new Error('Nenhum fator de autenticação encontrado.');
      const { data: challenge, error: eChallenge } = await RO.sb.auth.mfa.challenge({ factorId: factor.id });
      if(eChallenge) throw eChallenge;
      const { error: eVerify } = await RO.sb.auth.mfa.verify({ factorId: factor.id, challengeId: challenge.id, code });
      if(eVerify) throw eVerify;
      window.location.href = next;
    }catch(err){
      setError(err.message === 'Invalid TOTP code entered' ? 'Código incorreto. Tente novamente.' : err.message);
      btn.disabled = false; btn.textContent = 'Verificar';
    }
  });
})();
</script>
</body></html>

const pedidoUI = {
  buscaNumero:'', novoItens: [], listaFiltro:'', listaPage:1, sortKey:null, sortDir:'desc',
  prefillCliente:null, prefillForma:null, prefillCondicao:null,
  // Pasta por mês do "próximo pagamento": filtroMes null = todos os meses do ano selecionado.
  filtroMes: null, filtroAno: new Date().getFullYear(),
};
const PED_LISTA_NUMERIC_KEYS = new Set(['numero','total','proximo']);
const PED_LISTA_PAGESIZE = 20;
const MESES_LABEL = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
// Conta, para o ano informado, quantos pedidos têm o "próximo pagamento" em cada mês
// (chave 1-12) — alimenta os contadores das pastas de mês na tela de Pedidos.
function contarPedidosPorMes(ano){
  const counts = {};
  S.pedidos.forEach(p=>{
    const prox = proximoPagamentoPedido(p);
    if(prox && prox.getFullYear()===ano){
      const m = prox.getMonth()+1;
      counts[m] = (counts[m]||0)+1;
    }
  });
  return counts;
}

// Abre a ficha de um pedido em outra aba do navegador (mesma página, com a rota
// #/pedido/<numero> no hash, que a inicialização do app sabe carregar direto).
// Abre a ficha de um pedido na própria tela de "Pedidos" (navegação via hash, sem
// window.open — abrir em nova aba dependia de pop-up e podia ser bloqueado pelo
// navegador; a rota #/pedido/<numero> já sabe carregar a ficha direto).
function abrirFichaPedido(numero){
  location.hash = '#/pedido/'+encodeURIComponent(numero);
}

function clienteOptionsDatalist(){
  const arr = Array.from(S.clientes.values());
  return arr.map(c=>`<option data-codigo="${esc(c.codigo)}" value="${esc(c.nome)} (cód. ${esc(c.codigo)})"></option>`).join('');
}
function produtoOptionsDatalist(){
  const arr = Array.from(S.produtos.values());
  return arr.map(p=>`<option data-codigo="${esc(p.codigo)}" value="${esc(p.descricao)} (cód. ${esc(p.codigo)})"></option>`).join('');
}
function findClienteByLabel(label){
  const m = label.match(/\(cód\.\s*([^)]+)\)\s*$/);
  if(m) return S.clientes.get(m[1].trim());
  let found=null;
  S.clientes.forEach(c=>{ if(!found && normName(c.nome)===normName(label)) found=c; });
  return found;
}
function findProdutoByLabel(label){
  const m = label.match(/\(cód\.\s*([^)]+)\)\s*$/);
  if(m) return S.produtos.get(m[1].trim());
  let found=null;
  S.produtos.forEach(p=>{ if(!found && normName(p.descricao)===normName(label)) found=p; });
  return found;
}

const FORMAS_PGTO = ['DINHEIRO','BOLETO','CHEQUE','CARTÃO DE DÉBITO','CARTÃO DE CRÉDITO','PIX'];
const CONDICOES = ['À VISTA','30 DIAS','30/30 DIAS','30/30/30 DIAS','30/30/30/30 DIAS','30/30/30/30/30 DIAS'];

/* -------- "Pedidos": busca, filtros e tabela com todos os pedidos -------- */
function renderPedidosLista(el){
  setTitle('Pedidos', 'Consulta, filtros e busca de pedidos', backHomeBtn());
  if(!S.loaded.clientes || !S.loaded.produtos || !S.loaded.pedidos){
    el.innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando…</div>'; return;
  }

  el.innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <div class="card-head"><h2>Buscar pedido</h2></div>
      <div class="card-body">
        <div style="display:flex; gap:10px;">
          <div class="searchbar" style="max-width:280px;">${ICONS.search}<input id="ped-busca" placeholder="Número do pedido…" value="${esc(pedidoUI.buscaNumero)}"></div>
          <button class="btn primary" id="ped-buscar-btn">Buscar</button>
        </div>
        <div id="ped-resultado" style="margin-top:18px;"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="card-head"><h2>Pastas por mês &middot; próximo pagamento</h2></div>
      <div class="card-body" id="ped-folder-nav"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Todos os pedidos</h2></div>
      <div class="card-body">
        <div class="searchbar" style="max-width:320px; margin-bottom:14px;">${ICONS.search}<input id="ped-lista-filtro" placeholder="Buscar por nº ou cliente…" value="${esc(pedidoUI.listaFiltro)}"></div>
        <div id="ped-lista-inner"></div>
      </div>
    </div>
  `;

  function renderFolderNav(){
    const wrap = document.getElementById('ped-folder-nav');
    if(!wrap) return;
    const counts = contarPedidosPorMes(pedidoUI.filtroAno);
    const totalAno = Object.values(counts).reduce((s,n)=>s+n,0);
    wrap.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <button class="iconbtn" id="ped-ano-prev" title="Ano anterior">${ICONS.back}</button>
        <strong style="min-width:52px; text-align:center; font-size:15px;">${pedidoUI.filtroAno}</strong>
        <button class="iconbtn" id="ped-ano-next" title="Próximo ano" style="transform:scaleX(-1);">${ICONS.back}</button>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <button class="btn ${pedidoUI.filtroMes===null?'primary':''}" data-mes="">Todos <span style="opacity:.75;">(${totalAno})</span></button>
        ${MESES_LABEL.map((m,i)=>{
          const mes = i+1;
          return `<button class="btn ${pedidoUI.filtroMes===mes?'primary':''}" data-mes="${mes}">${m} <span style="opacity:.75;">(${counts[mes]||0})</span></button>`;
        }).join('')}
      </div>
    `;
    wrap.querySelector('#ped-ano-prev').onclick = ()=>{ pedidoUI.filtroAno--; pedidoUI.listaPage=1; renderFolderNav(); renderListaPedidosBody(); };
    wrap.querySelector('#ped-ano-next').onclick = ()=>{ pedidoUI.filtroAno++; pedidoUI.listaPage=1; renderFolderNav(); renderListaPedidosBody(); };
    wrap.querySelectorAll('[data-mes]').forEach(btn=>{
      btn.onclick = ()=>{
        pedidoUI.filtroMes = btn.dataset.mes ? parseInt(btn.dataset.mes,10) : null;
        pedidoUI.listaPage = 1;
        renderFolderNav();
        renderListaPedidosBody();
      };
    });
  }

  document.getElementById('ped-buscar-btn').onclick = doBuscarPedido;
  document.getElementById('ped-busca').addEventListener('keydown', e=>{ if(e.key==='Enter') doBuscarPedido(); });
  async function doBuscarPedido(){
    const numero = document.getElementById('ped-busca').value.trim();
    pedidoUI.buscaNumero = numero;
    const out = document.getElementById('ped-resultado');
    if(!numero){ out.innerHTML=''; return; }
    out.innerHTML = '<div class="spinner"></div>';
    let pedido = S.pedidos.get(numero) || S.pedidos.get(String(parseInt(numero,10)));
    if(!pedido){
      try{ const snap = await S.db.doc('pedidos/'+numero).get(); if(snap.exists) pedido = snap.data(); }catch(e){}
    }
    if(!pedido){ out.innerHTML = '<div class="alertbox info">'+ICONS.warn+'<div>Nenhum pedido encontrado com o número '+esc(numero)+'.</div></div>'; return; }
    out.innerHTML = renderFichaHTML(pedido);
    wireFichaActions(out, pedido);
  }

  document.getElementById('ped-lista-filtro').oninput = (e)=>{ pedidoUI.listaFiltro = e.target.value; pedidoUI.listaPage = 1; renderListaPedidosBody(); };
  function renderListaPedidosBody(){
    const wrapInner = document.getElementById('ped-lista-inner');
    if(!wrapInner) return;
    const filtro = pedidoUI.listaFiltro.trim().toLowerCase();
    let list = Array.from(S.pedidos.values());
    if(filtro){
      list = list.filter(p=>{
        const cliente = S.clientes.get(p.codigo_cliente);
        const nome = (p.cliente_nome || (cliente?cliente.nome:'') || '').toLowerCase();
        return String(p.numero).toLowerCase().includes(filtro) || nome.includes(filtro);
      });
    }
    // enriquece cada pedido com os dados calculados (total, status, nome do cliente,
    // próximo pagamento) antes de ordenar, já que essas colunas não existem prontas
    // no documento.
    let enriched = list.map(p=>{
      const totalGeral = (p.itens||[]).reduce((s,it)=> s + (it.valor_venda||0)*(it.uni||1), 0);
      const totalRecebido = (p.itens||[]).reduce((s,it)=> s + (it.parcelas||[]).reduce((s2,pp)=>s2+(pp.recebimento||0),0), 0);
      const quitado = totalRecebido >= totalGeral - 0.005;
      const cliente = S.clientes.get(p.codigo_cliente);
      const clienteNome = p.cliente_nome || (cliente?cliente.nome:'') || '';
      const proximoPagamento = proximoPagamentoPedido(p);
      return { p, totalGeral, quitado, clienteNome, proximoPagamento };
    });
    // Pasta por mês: mantém só os pedidos cujo próximo pagamento cai no mês/ano
    // selecionado na navegação acima (filtroMes null = todos os meses do ano).
    if(pedidoUI.filtroMes){
      enriched = enriched.filter(row=> row.proximoPagamento && row.proximoPagamento.getFullYear()===pedidoUI.filtroAno && (row.proximoPagamento.getMonth()+1)===pedidoUI.filtroMes);
    }
    enriched = sortRows(enriched, pedidoUI, (row,key)=>{
      if(key==='numero') return row.p.numero;
      if(key==='cliente') return row.clienteNome;
      if(key==='data') return row.p.data_compra;
      if(key==='total') return row.totalGeral;
      if(key==='status') return row.quitado ? 'Quitado' : 'Em aberto';
      if(key==='proximo') return row.proximoPagamento ? row.proximoPagamento.getTime() : Infinity;
      return '';
    }, PED_LISTA_NUMERIC_KEYS, (a,b)=> (Number(b.p.numero)||0)-(Number(a.p.numero)||0));
    const total = enriched.length;
    const pages = Math.max(1, Math.ceil(total/PED_LISTA_PAGESIZE));
    pedidoUI.listaPage = Math.min(pedidoUI.listaPage, pages);
    const start = (pedidoUI.listaPage-1)*PED_LISTA_PAGESIZE;
    const pageItems = enriched.slice(start, start+PED_LISTA_PAGESIZE);

    wrapInner.innerHTML = `
      <div class="table-wrap">
        <table class="data">
          <thead><tr>${thSort('Nº','numero',pedidoUI,PED_LISTA_NUMERIC_KEYS)}${thSort('Cliente','cliente',pedidoUI,PED_LISTA_NUMERIC_KEYS)}${thSort('Data','data',pedidoUI,PED_LISTA_NUMERIC_KEYS)}${thSort('Total','total',pedidoUI,PED_LISTA_NUMERIC_KEYS,'num')}${thSort('Próximo pagamento','proximo',pedidoUI,PED_LISTA_NUMERIC_KEYS)}${thSort('Status','status',pedidoUI,PED_LISTA_NUMERIC_KEYS)}<th></th></tr></thead>
          <tbody>
            ${pageItems.length ? pageItems.map(({p,totalGeral,quitado,clienteNome,proximoPagamento})=>{
              const hoje = new Date(); hoje.setHours(0,0,0,0);
              const vencido = proximoPagamento && proximoPagamento < hoje;
              return `<tr class="pedrow" data-numero="${esc(p.numero)}" title="Abrir ficha do pedido">
                <td>${esc(p.numero)}</td>
                <td>${esc(clienteNome||'—')}</td>
                <td>${fmtDate(p.data_compra)}</td>
                <td class="num">${fmtBRL(totalGeral)}</td>
                <td>${proximoPagamento ? `<span class="badge ${vencido?'alert':'pending'}">${fmtDate(proximoPagamento)}</span>` : '—'}</td>
                <td><span class="badge ${quitado?'ok':'pending'}">${quitado?'Quitado':'Em aberto'}</span></td>
                <td style="text-align:right; color:var(--muted);">${ICONS.external}</td>
              </tr>`;
            }).join('') : `<tr><td colspan="7"><div class="empty">${ICONS.file}<div>Nenhum pedido encontrado ${pedidoUI.filtroMes?('em '+MESES_LABEL[pedidoUI.filtroMes-1]+'/'+pedidoUI.filtroAno):''}.</div></div></td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="pager" style="padding:12px 18px;">
        <span>${total} pedido${total===1?'':'s'} &middot; Página ${pedidoUI.listaPage} de ${pages}</span>
        <div style="display:flex; gap:8px;">
          <button class="btn" ${pedidoUI.listaPage<=1?'disabled':''} id="ped-lista-prev">Anterior</button>
          <button class="btn" ${pedidoUI.listaPage>=pages?'disabled':''} id="ped-lista-next">Próxima</button>
        </div>
      </div>
    `;
    wireSortHeaders(wrapInner, pedidoUI, PED_LISTA_NUMERIC_KEYS, renderListaPedidosBody);
    // Navega na mesma aba (sem window.open) — evita o bloqueio de pop-up do navegador.
    wrapInner.querySelectorAll('.pedrow').forEach(tr=>{ tr.onclick = ()=> abrirFichaPedido(tr.dataset.numero); });
    const prevBtn = document.getElementById('ped-lista-prev'); if(prevBtn) prevBtn.onclick = ()=>{ pedidoUI.listaPage--; renderListaPedidosBody(); };
    const nextBtn = document.getElementById('ped-lista-next'); if(nextBtn) nextBtn.onclick = ()=>{ pedidoUI.listaPage++; renderListaPedidosBody(); };
  }
  renderFolderNav();
  renderListaPedidosBody();

  // Chegando via #/pedido/<numero> (ex: clicado na tabela acima, ou em "Duplicar
  // pedido" a partir de outra tela) abre a ficha direto, sem precisar digitar de novo.
  if(S.routeParam){
    const num = S.routeParam;
    S.routeParam = null;
    pedidoUI.buscaNumero = num;
    document.getElementById('ped-busca').value = num;
    doBuscarPedido();
  }
}

/* -------- "Criação de pedidos": formulário de novo pedido -------- */
function renderPedidoNovo(el){
  setTitle('Criação de pedidos', 'Emissão de novos pedidos', backHomeBtn());
  if(!S.loaded.clientes || !S.loaded.produtos || !S.loaded.pedidos){
    el.innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando…</div>'; return;
  }

  el.innerHTML = `
    <div class="card" id="ped-novo-card">
      <div class="card-head"><h2>Novo pedido</h2><button class="btn" id="ped-add-item">${ICONS.plus} Adicionar item</button></div>
      <div class="card-body">
        <div id="ped-error"></div>
        ${pedidoUI.prefillCliente ? `<div class="alertbox info">${ICONS.check}<div>Itens do pedido duplicado. Revise os dados e clique em "Emitir pedido" para confirmar.</div></div>` : ''}
        <div class="field-grid" style="margin-bottom:18px;">
          <div class="field"><label>Nº do pedido</label><input disabled value="${nextPedidoNumero()}"></div>
          <div class="field"><label>Data da compra</label><input id="np-data" type="date" value="${todayISO()}"></div>
          <div class="field span2"><label>Cliente *</label>
            <input id="np-cliente" list="dl-clientes" placeholder="Buscar por nome ou código…" value="${esc(pedidoUI.prefillCliente||'')}">
            <datalist id="dl-clientes">${clienteOptionsDatalist()}</datalist>
          </div>
          <div class="field"><label>Forma de pagamento</label>
            <select id="np-forma">${FORMAS_PGTO.map(f=>`<option ${pedidoUI.prefillForma===f?'selected':''}>${f}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Condição de pagamento</label>
            <select id="np-condicao">${CONDICOES.map((c,i)=>`<option value="${i+1}" ${pedidoUI.prefillCondicao===(i+1)?'selected':''}>${c}</option>`).join('')}</select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Produto</th><th>Uni.</th><th class="num">Valor unit.</th><th>Parcelas</th><th class="num">Valor/parcela</th><th></th></tr></thead>
            <tbody id="np-itens-body"></tbody>
          </table>
        </div>
        <div style="text-align:right; margin-top:12px; font-size:14px;"><strong>Total do pedido: <span id="np-total">R$ 0,00</span></strong></div>
        <div style="margin-top:16px; display:flex; justify-content:flex-end;">
          <button class="btn primary" id="np-salvar">${ICONS.check} Emitir pedido</button>
        </div>
      </div>
    </div>
  `;

  // Prefill vindo de "Duplicar pedido" é consumido uma única vez.
  pedidoUI.prefillCliente = null; pedidoUI.prefillForma = null; pedidoUI.prefillCondicao = null;

  if(pedidoUI.novoItens.length===0) pedidoUI.novoItens.push(blankItem());
  renderItensRows();
  document.getElementById('np-add-item') // no-op guard
  document.getElementById('ped-add-item').onclick = ()=>{ pedidoUI.novoItens.push(blankItem()); renderItensRows(); };

  function blankItem(){ return { produtoLabel:'', codigo_produto:'', descricao:'', uni:1, valor_unit:0, parcelas_qtd:1, valor_parcela:0 }; }

  function renderItensRows(){
    const body = document.getElementById('np-itens-body');
    body.innerHTML = pedidoUI.novoItens.map((it,idx)=>`
      <tr>
        <td style="min-width:220px;"><input list="dl-produtos" data-idx="${idx}" class="np-produto" value="${esc(it.produtoLabel)}" placeholder="Buscar produto…"></td>
        <td style="width:70px;"><input type="number" min="1" data-idx="${idx}" class="np-uni" value="${it.uni}"></td>
        <td class="num" style="width:120px;"><input type="number" step="0.01" data-idx="${idx}" class="np-unit" value="${it.valor_unit}"></td>
        <td style="width:90px;"><input type="number" min="1" data-idx="${idx}" class="np-parcelas" value="${it.parcelas_qtd}"></td>
        <td class="num" style="width:120px;"><input type="number" step="0.01" data-idx="${idx}" class="np-valorparcela" value="${it.valor_parcela}"></td>
        <td><button class="iconbtn np-del" data-idx="${idx}" title="Remover">${ICONS.trash}</button></td>
      </tr>`).join('') + (produtoOptionsDatalist() ? `<tr style="display:none"></tr>` : '');
    body.insertAdjacentHTML('beforebegin', '');
    if(!document.getElementById('dl-produtos')){
      document.getElementById('np-itens-body').insertAdjacentHTML('afterend', `<datalist id="dl-produtos">${produtoOptionsDatalist()}</datalist>`);
    }
    body.querySelectorAll('.np-produto').forEach(inp=> inp.onchange = (e)=>{
      const idx = +e.target.dataset.idx; const it = pedidoUI.novoItens[idx];
      it.produtoLabel = e.target.value;
      const prod = findProdutoByLabel(e.target.value);
      if(prod){ it.codigo_produto = prod.codigo; it.descricao = prod.descricao; it.valor_unit = Number(prod.valor_venda)||0; it.valor_custo = Number(prod.valor_compra)||0; }
      recalcRow(idx); renderItensRows();
    });
    body.querySelectorAll('.np-uni').forEach(inp=> inp.oninput = (e)=>{ pedidoUI.novoItens[+e.target.dataset.idx].uni = parseFloat(e.target.value)||1; recalcRow(+e.target.dataset.idx); updateTotal(); });
    body.querySelectorAll('.np-unit').forEach(inp=> inp.oninput = (e)=>{ pedidoUI.novoItens[+e.target.dataset.idx].valor_unit = parseFloat(e.target.value)||0; recalcRow(+e.target.dataset.idx); updateTotal(); });
    body.querySelectorAll('.np-parcelas').forEach(inp=> inp.oninput = (e)=>{ pedidoUI.novoItens[+e.target.dataset.idx].parcelas_qtd = parseInt(e.target.value)||1; recalcRow(+e.target.dataset.idx); updateTotal(); });
    body.querySelectorAll('.np-valorparcela').forEach(inp=> inp.oninput = (e)=>{ pedidoUI.novoItens[+e.target.dataset.idx].valor_parcela = parseFloat(e.target.value)||0; updateTotal(); });
    body.querySelectorAll('.np-del').forEach(btn=> btn.onclick = (e)=>{ pedidoUI.novoItens.splice(+e.target.closest('button').dataset.idx,1); if(pedidoUI.novoItens.length===0) pedidoUI.novoItens.push(blankItem()); renderItensRows(); updateTotal(); });
    updateTotal();
  }
  function recalcRow(idx){
    const it = pedidoUI.novoItens[idx];
    const total = (it.valor_unit||0) * (it.uni||1);
    it.valor_parcela = it.parcelas_qtd ? Math.round((total/it.parcelas_qtd)*100)/100 : total;
    const cell = document.querySelector('.np-valorparcela[data-idx="'+idx+'"]');
    if(cell) cell.value = it.valor_parcela;
  }
  function updateTotal(){
    const total = pedidoUI.novoItens.reduce((s,it)=> s + (it.valor_unit||0)*(it.uni||1), 0);
    const elT = document.getElementById('np-total'); if(elT) elT.textContent = fmtBRL(total);
  }

  document.getElementById('np-salvar').onclick = salvarPedido;
  async function salvarPedido(){
    const errBox = document.getElementById('ped-error'); errBox.innerHTML='';
    const clienteLabel = document.getElementById('np-cliente').value.trim();
    const cliente = findClienteByLabel(clienteLabel);
    if(!cliente){ errBox.innerHTML = '<div class="alertbox danger">'+ICONS.warn+'<div>Selecione um cliente válido da lista.</div></div>'; errBox.scrollIntoView({behavior:'smooth', block:'center'}); toast('Erro no salvamento', 'err'); return; }
    const itensValidos = pedidoUI.novoItens.filter(it=>it.codigo_produto);
    if(itensValidos.length===0){ errBox.innerHTML = '<div class="alertbox danger">'+ICONS.warn+'<div>Adicione ao menos um produto válido.</div></div>'; errBox.scrollIntoView({behavior:'smooth', block:'center'}); toast('Erro no salvamento', 'err'); return; }

    const numero = nextPedidoNumero();
    const itens = itensValidos.map(it=>({
      codigo_produto: it.codigo_produto,
      descricao: it.descricao,
      uni: it.uni||1,
      valor_venda: it.valor_unit||0,
      valor_compra: it.valor_custo||0,
      parcelas_qtd: it.parcelas_qtd||1,
      valor_parcela: it.valor_parcela||0,
      parcelas: Array.from({length: it.parcelas_qtd||1}, (_,i)=>({ n:i+1, data_pgto:null, recibo:'', recebimento:0 })),
    }));
    const doc = {
      numero, data_compra: document.getElementById('np-data').value || todayISO(),
      codigo_cliente: cliente.codigo, cliente_nome: cliente.nome,
      forma_pagamento: document.getElementById('np-forma').value,
      condicao_pgto: parseInt(document.getElementById('np-condicao').value,10),
      itens,
    };
    try{
      if(!S.db) throw new Error('Sem conexão com o banco de dados nesta visualização.');
      await S.db.collection('pedidos').doc(String(numero)).set(doc);
      S.pedidos.set(String(numero), doc);
      await ajustarEstoquePedido([], itens);
      toast('Salvo', 'ok');
      pedidoUI.novoItens = [];
      pedidoUI.buscaNumero = String(numero);
      // Volta para a tela "Pedidos", que abre a ficha do pedido recém-emitido
      // automaticamente (rota #/pedido/<numero>).
      location.hash = '#/pedido/'+encodeURIComponent(numero);
    }catch(e){
      console.error('Erro ao emitir pedido:', e);
      errBox.innerHTML = '<div class="alertbox danger">'+ICONS.warn+'<div>Erro ao emitir pedido: '+esc((e&&e.message)||String(e))+'</div></div>';
      errBox.scrollIntoView({behavior:'smooth', block:'center'});
      toast('Erro no salvamento', 'err');
    }
  }
}

function renderFichaHTML(pedido){
  const cliente = S.clientes.get(pedido.codigo_cliente);
  const totalGeral = (pedido.itens||[]).reduce((s,it)=> s + (it.valor_venda||0)*(it.uni||1), 0);
  const totalRecebido = (pedido.itens||[]).reduce((s,it)=> s + (it.parcelas||[]).reduce((s2,p)=>s2+(p.recebimento||0),0), 0);
  const quitado = totalRecebido >= totalGeral - 0.005;
  return `
    <div class="ficha">
      <div class="ficha-top">
        <div>
          <h2>RAMOS DE OLIVEIRA ENXOVAIS</h2>
          <div style="color:var(--muted); font-size:12.5px; margin-top:2px;">Pedido nº ${esc(pedido.numero)} &middot; ${fmtDate(pedido.data_compra)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="badge ${quitado?'ok':'pending'}">${quitado?'Quitado':'Em aberto'}</span>
          <button class="btn ghost fp-duplicar" title="Criar um novo pedido com os mesmos itens">${ICONS.box} Duplicar pedido</button>
          <button class="iconbtn fp-editar" title="Editar ficha">${ICONS.edit}</button>
          <button class="iconbtn fp-excluir" title="Excluir ficha">${ICONS.trash}</button>
        </div>
      </div>
      <dl>
        <dt>Cliente</dt><dd>${esc(pedido.cliente_nome||(cliente?cliente.nome:''))} (cód. ${esc(pedido.codigo_cliente)})</dd>
        <dt>Endereço</dt><dd>${cliente? esc([cliente.rua,cliente.numero,cliente.bairro,cliente.cidade,cliente.estado].filter(Boolean).join(', ')) : '—'}</dd>
        <dt>CPF</dt><dd>${cliente? esc(cliente.cpf_cnpj)||'—' : '—'}</dd>
        <dt>Forma de pagamento</dt><dd>${esc(pedido.forma_pagamento)} &middot; ${esc(CONDICOES[(pedido.condicao_pgto||1)-1]||'')}</dd>
      </dl>
      <div class="table-wrap" style="margin-top:16px;">
        <table class="data">
          <thead><tr><th>Produto</th><th>Uni.</th><th>Parcela</th><th class="num">Valor</th><th>Data pgto.</th><th class="num">Recebimento</th><th class="num">Saldo devedor</th><th></th></tr></thead>
          <tbody>
            ${(pedido.itens||[]).map((it,itIdx)=>{
              const total = (it.valor_venda||0)*(it.uni||1);
              let saldo = total;
              return (it.parcelas||[]).map((p,pIdx)=>{
                saldo -= (p.recebimento||0);
                const pago = !!p.data_pgto;
                return `<tr>
                  <td>${pIdx===0?esc(it.descricao):''}</td>
                  <td>${pIdx===0?esc(it.uni):''}</td>
                  <td>${p.n}/${it.parcelas_qtd}</td>
                  <td class="num">${fmtBRL(it.valor_parcela)}</td>
                  <td>${p.data_pgto? fmtDate(p.data_pgto) : '<span class="badge pending">pendente</span>'}</td>
                  <td class="num">${fmtBRL(p.recebimento)}</td>
                  <td class="num">${fmtBRL(Math.max(saldo,0))}</td>
                  <td>${!pago?`<button class="btn ghost fp-pagar" data-item="${itIdx}" data-parc="${pIdx}" style="font-size:12px;">Registrar pgto.</button>`:''}</td>
                </tr>`;
              }).join('');
            }).join('')}
          </tbody>
        </table>
      </div>
      <div style="text-align:right; margin-top:12px; font-size:13.5px;">
        Total do pedido: <strong>${fmtBRL(totalGeral)}</strong> &middot; Recebido: <strong>${fmtBRL(totalRecebido)}</strong> &middot; Saldo: <strong>${fmtBRL(Math.max(totalGeral-totalRecebido,0))}</strong>
      </div>
    </div>
  `;
}

function wireFichaActions(container, pedido){
  container.querySelectorAll('.fp-pagar').forEach(btn=>{
    btn.onclick = ()=> openRegistrarPagamento(pedido, +btn.dataset.item, +btn.dataset.parc, container);
  });
  const editBtn = container.querySelector('.fp-editar');
  if(editBtn) editBtn.onclick = ()=> openEditarFicha(pedido, container);
  const delBtn = container.querySelector('.fp-excluir');
  if(delBtn) delBtn.onclick = ()=> excluirFicha(pedido, container);
  const dupBtn = container.querySelector('.fp-duplicar');
  if(dupBtn) dupBtn.onclick = ()=> duplicarPedido(pedido);
}

// Preenche o formulário "Novo pedido" (mesma página) com os itens de um pedido já
// existente, para agilizar vendas repetidas para o mesmo cliente — não salva nada
// sozinho, só deixa pronto para revisão antes de "Emitir pedido".
function duplicarPedido(pedido){
  pedidoUI.novoItens = (pedido.itens||[]).map(it=>({
    produtoLabel: it.descricao ? (it.descricao+' (cód. '+it.codigo_produto+')') : '',
    codigo_produto: it.codigo_produto, descricao: it.descricao,
    uni: it.uni||1, valor_unit: it.valor_venda||0, valor_custo: it.valor_compra||0,
    parcelas_qtd: it.parcelas_qtd||1, valor_parcela: it.valor_parcela||0,
  }));
  if(pedidoUI.novoItens.length===0) pedidoUI.novoItens.push({ produtoLabel:'', codigo_produto:'', descricao:'', uni:1, valor_unit:0, parcelas_qtd:1, valor_parcela:0 });
  pedidoUI.prefillCliente = pedido.cliente_nome ? (pedido.cliente_nome+' (cód. '+pedido.codigo_cliente+')') : '';
  pedidoUI.prefillForma = pedido.forma_pagamento || null;
  pedidoUI.prefillCondicao = pedido.condicao_pgto || null;
  toast('Pedido duplicado — revise os dados e clique em "Emitir pedido".', 'ok');
  go('pedido-novo');
}

async function excluirFicha(pedido, container){
  if(!confirm('Excluir definitivamente o pedido nº '+pedido.numero+'? Esta ação não pode ser desfeita.')) return;
  try{
    if(!S.db) throw new Error('Sem conexão com o banco de dados nesta visualização.');
    await S.db.collection('pedidos').doc(String(pedido.numero)).delete();
    S.pedidos.delete(String(pedido.numero));
    await ajustarEstoquePedido(pedido.itens, []);
    toast('Pedido nº '+pedido.numero+' excluído.', 'ok');
    container.innerHTML = '';
    pedidoUI.buscaNumero = '';
    const buscaInput = document.getElementById('ped-busca');
    if(buscaInput) buscaInput.value = '';
  }catch(e){
    console.error('Erro ao excluir pedido:', e);
    toast('Erro ao excluir: '+((e&&e.message)||String(e)), 'err');
  }
}

function blankParcela(n){ return { n, data_pgto:null, recebimento:0, recibo:'' }; }
function blankFichaItem(){
  return { codigo_produto:'', descricao:'', uni:1, valor_venda:0, valor_compra:0, parcelas_qtd:1, valor_parcela:0, parcelas:[blankParcela(1)] };
}

function openEditarFicha(pedido, container){
  const draft = JSON.parse(JSON.stringify(pedido));
  if(!Array.isArray(draft.itens) || draft.itens.length===0) draft.itens = [blankFichaItem()];
  const clienteAtual = S.clientes.get(draft.codigo_cliente);
  const clienteLabelInicial = clienteAtual ? `${clienteAtual.nome} (cód. ${clienteAtual.codigo})` : (draft.cliente_nome||'');

  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `
    <div class="modal" style="max-width:780px; max-height:88vh; display:flex; flex-direction:column;">
      <div class="modal-head"><h3>Editar pedido nº ${esc(draft.numero)}</h3><button class="iconbtn" id="ef-close">&times;</button></div>
      <div class="modal-body" style="overflow-y:auto;">
        <div id="ef-error"></div>
        <div class="field-grid" style="margin-bottom:16px;">
          <div class="field"><label>Data da compra</label><input id="ef-data" type="date" value="${esc(draft.data_compra||'')}"></div>
          <div class="field span2"><label>Cliente</label>
            <input id="ef-cliente" list="ef-dl-clientes" value="${esc(clienteLabelInicial)}" placeholder="Buscar por nome ou código…">
            <datalist id="ef-dl-clientes">${clienteOptionsDatalist()}</datalist>
          </div>
          <div class="field"><label>Forma de pagamento</label>
            <select id="ef-forma">${FORMAS_PGTO.map(f=>`<option ${f===draft.forma_pagamento?'selected':''}>${esc(f)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Condição (nº de parcelas)</label><input id="ef-condicao" type="number" min="1" value="${draft.condicao_pgto||1}"></div>
        </div>
        <div id="ef-itens"></div>
        <button class="btn" id="ef-add-item" style="margin-top:6px;">${ICONS.plus} Adicionar produto</button>
        <div style="text-align:right; margin-top:14px; font-size:13.5px; color:var(--muted);" id="ef-resumo"></div>
      </div>
      <div class="modal-foot"><button class="btn" id="ef-cancel">Cancelar</button><button class="btn primary" id="ef-save">${ICONS.check} Salvar alterações</button></div>
    </div>`;
  document.body.appendChild(back);
  const close = ()=> back.remove();
  back.querySelector('#ef-close').onclick = close;
  back.querySelector('#ef-cancel').onclick = close;

  function itemTotal(it){ return (it.valor_parcela||0) * (it.parcelas_qtd||0); }

  function renderResumo(){
    const totalGeral = draft.itens.reduce((s,it)=> s + itemTotal(it)*(it.uni||1), 0);
    const totalRecebido = draft.itens.reduce((s,it)=> s + (it.parcelas||[]).reduce((s2,p)=> s2+(Number(p.recebimento)||0), 0), 0);
    back.querySelector('#ef-resumo').innerHTML = `Total: <strong>${fmtBRL(totalGeral)}</strong> &middot; Recebido: <strong>${fmtBRL(totalRecebido)}</strong> &middot; Saldo: <strong>${fmtBRL(Math.max(totalGeral-totalRecebido,0))}</strong>`;
  }

  function recomputeSaldos(itIdx){
    const it = draft.itens[itIdx];
    const total = itemTotal(it);
    let saldo = total;
    (it.parcelas||[]).forEach((p,pIdx)=>{
      saldo -= (Number(p.recebimento)||0);
      const cell = back.querySelector(`.ef-saldo[data-it="${itIdx}"][data-p="${pIdx}"]`);
      if(cell) cell.textContent = fmtBRL(Math.max(saldo,0));
    });
    renderResumo();
  }

  function renderItemCard(itIdx){
    const it = draft.itens[itIdx];
    return `
      <div class="card" style="margin-top:12px; padding:12px;" id="ef-item-${itIdx}">
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
          <div class="field" style="flex:2; min-width:200px;"><label>Produto</label><input class="ef-produto" data-it="${itIdx}" value="${esc(it.descricao)}"></div>
          <div class="field" style="width:70px;"><label>Uni.</label><input type="number" min="1" class="ef-uni" data-it="${itIdx}" value="${it.uni||1}"></div>
          <div class="field" style="width:130px;"><label>Valor/parcela</label><input class="ef-valorparcela" data-it="${itIdx}" inputmode="decimal" value="${fmtNumBR(it.valor_parcela)}"></div>
          <div class="field" style="width:90px;"><label>Parcelas</label><input type="number" min="1" class="ef-parcelasqtd" data-it="${itIdx}" value="${it.parcelas_qtd||1}"></div>
          <button class="iconbtn ef-del-item" data-it="${itIdx}" title="Remover produto">${ICONS.trash}</button>
        </div>
        <div class="table-wrap" style="margin-top:10px;">
          <table class="data">
            <thead><tr><th style="width:70px;">Parcela</th><th>Data pgto.</th><th class="num">Recebimento</th><th class="num">Saldo devedor</th></tr></thead>
            <tbody>
              ${(it.parcelas||[]).map((p,pIdx)=>`
                <tr>
                  <td>${pIdx+1}/${it.parcelas_qtd}</td>
                  <td><input type="date" class="ef-datapgto" data-it="${itIdx}" data-p="${pIdx}" value="${p.data_pgto||''}"></td>
                  <td class="num"><input class="ef-recebimento" data-it="${itIdx}" data-p="${pIdx}" inputmode="decimal" value="${fmtNumBR(p.recebimento)}" style="text-align:right; width:110px;"></td>
                  <td class="num ef-saldo" data-it="${itIdx}" data-p="${pIdx}">R$ 0,00</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function wireItemCard(itIdx){
    const card = back.querySelector(`#ef-item-${itIdx}`);
    if(!card) return;
    card.querySelector('.ef-produto').oninput = (e)=>{ draft.itens[itIdx].descricao = e.target.value; };
    card.querySelector('.ef-uni').oninput = (e)=>{ draft.itens[itIdx].uni = parseFloat(e.target.value)||1; recomputeSaldos(itIdx); };
    const valorInp = card.querySelector('.ef-valorparcela');
    maskMoneyInput(valorInp);
    valorInp.addEventListener('input', ()=>{ draft.itens[itIdx].valor_parcela = parseNumBR(valorInp.value); recomputeSaldos(itIdx); });
    card.querySelector('.ef-parcelasqtd').onchange = (e)=>{
      let qtd = parseInt(e.target.value)||1; if(qtd<1) qtd=1;
      const it = draft.itens[itIdx];
      const removendoPagas = qtd < it.parcelas.length && it.parcelas.slice(qtd).some(p=>p.data_pgto);
      if(removendoPagas && !confirm('Reduzir o nº de parcelas vai remover parcelas que já têm pagamento registrado. Continuar?')){
        e.target.value = it.parcelas_qtd; return;
      }
      while(it.parcelas.length < qtd) it.parcelas.push(blankParcela(it.parcelas.length+1));
      if(it.parcelas.length > qtd) it.parcelas = it.parcelas.slice(0, qtd);
      it.parcelas.forEach((p,i)=> p.n = i+1);
      it.parcelas_qtd = qtd;
      card.outerHTML = renderItemCard(itIdx);
      wireItemCard(itIdx);
      recomputeSaldos(itIdx);
    };
    card.querySelectorAll('.ef-datapgto').forEach(inp=>{
      inp.onchange = (e)=>{ draft.itens[+e.target.dataset.it].parcelas[+e.target.dataset.p].data_pgto = e.target.value || null; };
    });
    card.querySelectorAll('.ef-recebimento').forEach(inp=>{
      maskMoneyInput(inp);
      inp.addEventListener('input', ()=>{
        const it2 = +inp.dataset.it, p2 = +inp.dataset.p;
        const valor = parseNumBR(inp.value);
        draft.itens[it2].parcelas[p2].recebimento = valor;
        // Se o valor recebido voltar a zero, a parcela volta a "pendente":
        // limpa a data de pagamento automaticamente.
        if(valor <= 0){
          draft.itens[it2].parcelas[p2].data_pgto = null;
          const dateInp = card.querySelector(`.ef-datapgto[data-it="${it2}"][data-p="${p2}"]`);
          if(dateInp) dateInp.value = '';
        }
        recomputeSaldos(it2);
      });
    });
    card.querySelector('.ef-del-item').onclick = ()=>{
      if(draft.itens.length<=1){ toast('O pedido precisa ter ao menos um produto.', 'err'); return; }
      if(!confirm('Remover este produto da ficha?')) return;
      draft.itens.splice(itIdx,1);
      renderAllItens();
    };
  }

  function renderAllItens(){
    back.querySelector('#ef-itens').innerHTML = draft.itens.map((it,itIdx)=> renderItemCard(itIdx)).join('');
    draft.itens.forEach((it,itIdx)=>{ wireItemCard(itIdx); recomputeSaldos(itIdx); });
    renderResumo();
  }

  renderAllItens();

  back.querySelector('#ef-add-item').onclick = ()=>{
    draft.itens.push(blankFichaItem());
    renderAllItens();
  };

  back.querySelector('#ef-save').onclick = async ()=>{
    const errBox = back.querySelector('#ef-error');
    errBox.innerHTML = '';
    const data = back.querySelector('#ef-data').value || draft.data_compra || todayISO();
    const clienteLabel = back.querySelector('#ef-cliente').value.trim();
    const clienteMatch = clienteLabel ? findClienteByLabel(clienteLabel) : null;
    draft.data_compra = data;
    draft.forma_pagamento = back.querySelector('#ef-forma').value;
    draft.condicao_pgto = parseInt(back.querySelector('#ef-condicao').value,10)||1;
    if(clienteMatch){ draft.codigo_cliente = clienteMatch.codigo; draft.cliente_nome = clienteMatch.nome; }
    else if(clienteLabel){ draft.cliente_nome = clienteLabel; }
    draft.itens.forEach(it=>{ it.valor_venda = it.valor_parcela * it.parcelas_qtd; });

    const saveBtn = back.querySelector('#ef-save');
    const saveBtnHTML = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = 'Salvando…';
    try{
      if(!S.db) throw new Error('Sem conexão com o banco de dados nesta visualização.');
      await S.db.collection('pedidos').doc(String(draft.numero)).set(draft);
      // `draft` is already a fresh, plain clone (built via JSON.parse(JSON.stringify(pedido))
      // above) — adopt it directly as the new cached copy. Never mutate the original
      // `pedido` object in place: it may be a frozen/immutable snapshot from the db
      // cache, and writing into it (e.g. deleting/reassigning its own keys) throws.
      S.pedidos.set(String(draft.numero), draft);
      await ajustarEstoquePedido(pedido.itens, draft.itens);
      toast('Salva a alteração', 'ok');
      container.innerHTML = renderFichaHTML(draft);
      wireFichaActions(container, draft);
      close();
    }catch(e){
      console.error('Erro ao salvar edição do pedido:', e);
      errBox.innerHTML = '<div class="alertbox danger">'+ICONS.warn+'<div>Erro ao salvar: '+esc((e&&e.message)||String(e))+'</div></div>';
      errBox.scrollIntoView({behavior:'smooth', block:'center'});
      toast('Erro no salvamento', 'err');
      saveBtn.disabled = false;
      saveBtn.innerHTML = saveBtnHTML;
    }
  };
}

function fmtNumBR(n){ return (Number(n)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function parseNumBR(str){
  if(!str) return 0;
  const cleaned = String(str).trim().replace(/\./g,'').replace(',', '.').replace(/[^0-9.\-]/g,'');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function maskMoneyInput(el){
  el.addEventListener('input', ()=>{
    let digits = el.value.replace(/\D/g,'');
    if(!digits){ el.value=''; return; }
    digits = digits.replace(/^0+(?=\d)/,'');
    while(digits.length<3) digits = '0'+digits;
    const intPart = (digits.slice(0,-2).replace(/^0+(?=\d)/,'') || '0');
    const decPart = digits.slice(-2);
    el.value = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + decPart;
  });
}

function openRegistrarPagamento(pedido, itIdx, pIdx, container){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <div class="modal-head"><h3>Registrar pagamento</h3><button class="iconbtn" id="rp-close">&times;</button></div>
      <div class="modal-body">
        <div id="rp-error"></div>
        <div class="field-grid" style="grid-template-columns:1fr;">
          <div class="field"><label>Data do pagamento</label><input id="rp-data" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Valor recebido</label><input id="rp-valor" inputmode="decimal" value="${fmtNumBR(pedido.itens[itIdx].valor_parcela)}"></div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn" id="rp-cancel">Cancelar</button><button class="btn primary" id="rp-save">${ICONS.check} Salvar</button></div>
    </div>`;
  document.body.appendChild(back);
  maskMoneyInput(back.querySelector('#rp-valor'));
  const close = ()=> back.remove();
  back.querySelector('#rp-close').onclick = close;
  back.querySelector('#rp-cancel').onclick = close;
  back.onclick = (e)=>{ if(e.target===back) close(); };
  const saveBtn = back.querySelector('#rp-save');
  const saveBtnHTML = saveBtn.innerHTML;
  saveBtn.onclick = async ()=>{
    const errBox = back.querySelector('#rp-error');
    errBox.innerHTML = '';
    const data = back.querySelector('#rp-data').value;
    const valor = parseNumBR(back.querySelector('#rp-valor').value);
    if(!data){ errBox.innerHTML = '<div class="alertbox danger">'+ICONS.warn+'<div>Informe a data do pagamento.</div></div>'; errBox.scrollIntoView({behavior:'smooth', block:'center'}); toast('Erro no salvamento', 'err'); return; }
    // Never mutate `pedido` in place: documents that came from the db cache/snapshot
    // can be frozen/immutable, and writing into their nested fields throws. Build a
    // fresh, plain clone, mutate that, and only adopt it after a successful save.
    const updated = JSON.parse(JSON.stringify(pedido));
    // Um valor recebido zerado nunca fica marcado como pago (mantém "pendente").
    updated.itens[itIdx].parcelas[pIdx].data_pgto = valor > 0 ? data : null;
    updated.itens[itIdx].parcelas[pIdx].recebimento = valor;
    saveBtn.disabled = true;
    saveBtn.innerHTML = 'Salvando…';
    try{
      if(!S.db) throw new Error('Sem conexão com o banco de dados nesta visualização.');
      await S.db.collection('pedidos').doc(String(updated.numero)).set(updated);
      S.pedidos.set(String(updated.numero), updated);
      toast('Pagamento registrado.', 'ok');
      container.innerHTML = renderFichaHTML(updated);
      wireFichaActions(container, updated);
      close();
    }catch(e){
      console.error('Erro ao registrar pagamento:', e);
      errBox.innerHTML = '<div class="alertbox danger">'+ICONS.warn+'<div>Erro ao salvar: '+esc((e&&e.message)||String(e))+'</div></div>';
      errBox.scrollIntoView({behavior:'smooth', block:'center'});
      toast('Erro no salvamento', 'err');
      saveBtn.disabled = false;
      saveBtn.innerHTML = saveBtnHTML;
    }
  };
}

const financeiroUI = { sortKey: null, sortDir: 'desc' };
const FIN_NUMERIC_KEYS = new Set(['pedidos','vendas','custo','lucro']);
const receberUI = { sortKey: 'vencimento', sortDir: 'asc', page: 1, pageSize: 15, soVencidas: false };
const REC_NUMERIC_KEYS = new Set(['numero','n','valor','vencimento','diasAtraso']);

function topClientes(limit){
  const totals = new Map(); // codigo_cliente -> {nome, total, pedidos}
  S.pedidos.forEach(p=>{
    const total = (p.itens||[]).reduce((s,it)=> s+(it.valor_venda||0)*(it.uni||1), 0);
    const key = p.codigo_cliente || p.cliente_nome;
    if(!key) return;
    if(!totals.has(key)) totals.set(key, { nome: p.cliente_nome || (S.clientes.get(p.codigo_cliente)||{}).nome || '—', total:0, pedidos:0 });
    const t = totals.get(key); t.total += total; t.pedidos++;
  });
  return Array.from(totals.values()).sort((a,b)=> b.total-a.total).slice(0, limit);
}
function topProdutos(limit){
  const totals = new Map(); // codigo_produto -> {descricao, qtd, total}
  S.pedidos.forEach(p=>{
    (p.itens||[]).forEach(it=>{
      const key = it.codigo_produto || it.descricao;
      if(!key) return;
      if(!totals.has(key)) totals.set(key, { descricao: it.descricao||'—', qtd:0, total:0 });
      const t = totals.get(key); t.qtd += (Number(it.uni)||1); t.total += (it.valor_venda||0)*(it.uni||1);
    });
  });
  return Array.from(totals.values()).sort((a,b)=> b.total-a.total).slice(0, limit);
}
function rankBars(rows, valueKey, labelKey, subFn){
  const max = Math.max(1, ...rows.map(r=>r[valueKey]));
  return rows.map((r,i)=>`
    <div class="rankrow">
      <div class="rankpos">${i+1}</div>
      <div class="rankinfo">
        <div class="rankname">${esc(r[labelKey])}</div>
        <div class="rankbar"><div class="rankbar-fill" style="width:${Math.max(3,Math.round(r[valueKey]/max*100))}%"></div></div>
      </div>
      <div class="rankvalue">${fmtBRL(r[valueKey])}${subFn?`<div class="ranksub">${esc(subFn(r))}</div>`:''}</div>
    </div>`).join('');
}

function renderFinanceiro(el){
  setTitle('Financeiro', 'Vendas e custo por mês', backHomeBtn());
  if(!S.loaded.pedidos){ el.innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando…</div>'; return; }

  const meses = new Map(); // 'YYYY-MM' -> {vendas, custo, pedidos}
  S.pedidos.forEach(p=>{
    const ym = (p.data_compra||'').slice(0,7);
    if(!ym) return;
    if(!meses.has(ym)) meses.set(ym, {vendas:0, custo:0, pedidos:0});
    const m = meses.get(ym);
    m.pedidos++;
    (p.itens||[]).forEach(it=>{
      m.vendas += (it.valor_venda||0)*(it.uni||1);
      m.custo += (it.valor_compra||0)*(it.uni||1);
    });
  });
  // Ordem cronológica (mais recente primeiro) sempre alimenta o gráfico, independente
  // de como a tabela abaixo esteja ordenada pelo usuário.
  const rows = Array.from(meses.entries()).sort((a,b)=> a[0]<b[0]?1:-1);
  const maxVal = Math.max(1, ...rows.map(([,m])=>Math.max(m.vendas,m.custo)));
  const chartRows = rows.slice(0,12).reverse();
  const tableRows = sortRows(rows, financeiroUI, (row,key)=>{
    const [ym,m] = row;
    if(key==='mes') return ym;
    if(key==='lucro') return m.vendas-m.custo;
    return m[key];
  }, FIN_NUMERIC_KEYS, (a,b)=> a[0]<b[0]?1:-1);

  let receberList = listaContasAReceber();
  if(receberUI.soVencidas) receberList = receberList.filter(l=>l.vencida);
  receberList = sortRows(receberList, receberUI, (row,key)=>{
    if(key==='vencimento') return row.vencimento ? row.vencimento.getTime() : Infinity;
    return row[key];
  }, REC_NUMERIC_KEYS, (a,b)=>{
    if(a.vencida!==b.vencida) return a.vencida ? -1 : 1;
    const av = a.vencimento?a.vencimento.getTime():Infinity, bv = b.vencimento?b.vencimento.getTime():Infinity;
    return av-bv;
  });
  const receberTotalCount = receberList.length;
  const receberPages = Math.max(1, Math.ceil(receberTotalCount/receberUI.pageSize));
  receberUI.page = Math.min(receberUI.page, receberPages);
  const receberStart = (receberUI.page-1)*receberUI.pageSize;
  const receberPageItems = receberList.slice(receberStart, receberStart+receberUI.pageSize);
  const receberVencidasCount = listaContasAReceber().filter(l=>l.vencida).length;

  const tClientes = topClientes(5);
  const tProdutos = topProdutos(5);

  el.innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <div class="card-head"><h2>Vendas &times; Custo (últimos ${chartRows.length} meses)</h2></div>
      <div class="card-body">
        ${chartRows.length ? `
        <svg viewBox="0 0 ${Math.max(chartRows.length*90,300)} 220" style="width:100%; height:220px; overflow:visible;" font-family="inherit">
          ${chartRows.map((([ym,m],i)=>{
            const x = i*90+20;
            const hV = Math.round((m.vendas/maxVal)*150);
            const hC = Math.round((m.custo/maxVal)*150);
            return `
              <g>
                <rect x="${x}" y="${170-hV}" width="26" height="${hV}" fill="var(--accent)" rx="3"></rect>
                <rect x="${x+30}" y="${170-hC}" width="26" height="${hC}" fill="var(--muted)" rx="3" opacity="0.55"></rect>
                <text x="${x+28}" y="192" text-anchor="middle" font-size="11" fill="var(--muted)">${ym.slice(5,7)}/${ym.slice(2,4)}</text>
              </g>`;
          })).join('')}
        </svg>
        <div style="display:flex; gap:18px; margin-top:8px; font-size:12.5px; color:var(--muted);">
          <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:3px;margin-right:5px;"></span>Vendas</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:var(--muted);opacity:.55;border-radius:3px;margin-right:5px;"></span>Custo</span>
        </div>` : `<div class="empty">${ICONS.coins}<div>Nenhum pedido lançado ainda.</div></div>`}
      </div>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <div class="card-head"><h2>Relatório mensal</h2></div>
      <div class="table-wrap" id="fin-mensal-wrap">
        <table class="data">
          <thead><tr>${thSort('Mês','mes',financeiroUI,FIN_NUMERIC_KEYS)}${thSort('Pedidos','pedidos',financeiroUI,FIN_NUMERIC_KEYS,'num')}${thSort('Vendas','vendas',financeiroUI,FIN_NUMERIC_KEYS,'num')}${thSort('Custo','custo',financeiroUI,FIN_NUMERIC_KEYS,'num')}${thSort('Lucro','lucro',financeiroUI,FIN_NUMERIC_KEYS,'num')}</tr></thead>
          <tbody>
            ${tableRows.length ? tableRows.map(([ym,m])=>`
              <tr>
                <td>${new Date(ym+'-02').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</td>
                <td class="num">${m.pedidos}</td>
                <td class="num">${fmtBRL(m.vendas)}</td>
                <td class="num">${fmtBRL(m.custo)}</td>
                <td class="num">${fmtBRL(m.vendas-m.custo)}</td>
              </tr>`).join('') : `<tr><td colspan="5"><div class="empty">Sem dados ainda.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="card-head">
        <h2>Contas a receber ${receberVencidasCount?`<span class="badge alert" style="margin-left:6px;">${receberVencidasCount} vencida${receberVencidasCount===1?'':'s'}</span>`:''}</h2>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:400; cursor:pointer;">
          <input type="checkbox" id="fin-so-vencidas" ${receberUI.soVencidas?'checked':''}> Mostrar só vencidas
        </label>
      </div>
      <div class="table-wrap" id="fin-receber-wrap">
        <table class="data">
          <thead><tr>${thSort('Cliente','cliente',receberUI,REC_NUMERIC_KEYS)}${thSort('Pedido','numero',receberUI,REC_NUMERIC_KEYS,'num')}${thSort('Parcela','n',receberUI,REC_NUMERIC_KEYS,'num')}${thSort('Vencimento (estimado)','vencimento',receberUI,REC_NUMERIC_KEYS)}${thSort('Valor','valor',receberUI,REC_NUMERIC_KEYS,'num')}<th>Situação</th></tr></thead>
          <tbody>
            ${receberPageItems.length ? receberPageItems.map(l=>`
              <tr>
                <td>${esc(l.cliente)}</td>
                <td class="num">${l.numero}</td>
                <td class="num">${l.n}/${l.totalParcelas}</td>
                <td class="num">${l.vencimento ? fmtDate(l.vencimento) : '—'}</td>

          </tbody>

      </div>
      <div class="pager" style="padding:12px 18px;">
        <span>Página ${receberUI.page} de ${receberPages} &middot; ${receberTotalCount} parcela${receberTotalCount===1?'':'s'} pendente${receberTotalCount===1?'':'s'}</span>
        <div style="display:flex; gap:8px;">
          <button class="btn" ${receberUI.page<=1?'disabled':''} id="fin-receber-prev">Anterior</button>
          <button class="btn" ${receberUI.page>=receberPages?'disabled':''} id="fin-receber-next">Próxima</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Rankings</h2></div>
      <div class="card-body">
        <div class="rank-grid">
          <div>
            <div class="so-title" style="margin-bottom:8px;">Melhores clientes (total comprado)</div>
            ${tClientes.length ? rankBars(tClientes,'total','nome', r=>`${r.pedidos} pedido${r.pedidos===1?'':'s'}`) : `<div class="empty">${ICONS.users}<div>Sem dados ainda.</div></div>`}
          </div>
          <div>
            <div class="so-title" style="margin-bottom:8px;">Produtos mais vendidos (valor)</div>
            ${tProdutos.length ? rankBars(tProdutos,'total','descricao', r=>`${r.qtd} un. vendida${r.qtd===1?'':'s'}`) : `<div class="empty">${ICONS.box}<div>Sem dados ainda.</div></div>`}
          </div>
        </div>
      </div>
    </div>
  `;
  wireSortHeaders(document.getElementById('fin-mensal-wrap'), financeiroUI, FIN_NUMERIC_KEYS, ()=>renderFinanceiro(el));
  wireSortHeaders(document.getElementById('fin-receber-wrap'), receberUI, REC_NUMERIC_KEYS, ()=>renderFinanceiro(el));
  document.getElementById('fin-so-vencidas').onchange = (e)=>{ receberUI.soVencidas = e.target.checked; receberUI.page = 1; renderFinanceiro(el); };
  const recPrev = document.getElementById('fin-receber-prev'); if(recPrev) recPrev.onclick = ()=>{ receberUI.page--; renderFinanceiro(el); };
  const recNext = document.getElementById('fin-receber-next'); if(recNext) recNext.onclick = ()=>{ receberUI.page++; renderFinanceiro(el); };
}

/* ================= BACKUP / EXPORTAÇÃO ================= */
function csvEscape(v){
  if(v===null || v===undefined) return '';
  const s = String(v);
  return /[;"\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(columns, rows){
  const header = columns.map(c=>csvEscape(c.label)).join(';');
  const body = rows.map(r=> columns.map(c=> csvEscape(typeof c.value==='function' ? c.value(r) : r[c.key])).join(';')).join('\r\n');
  // BOM no início para o Excel abrir os acentos corretamente.
  return '﻿' + header + '\r\n' + body;
}
async function baixarArquivo(filename, conteudo, mime){
  if(!S.downloads){ toast('Exportação de arquivos não está disponível nesta visualização.', 'err'); return false; }
  try{
    const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], {type: mime||'text/plain;charset=utf-8;'});
    await S.downloads.save({ filename, data: blob });
    toast('Arquivo exportado: '+filename, 'ok');
    return true;
  }catch(e){
    if(e && e.code==='declined') return false;
    toast('Erro ao exportar: '+((e&&e.message)||String(e)), 'err');
    return false;
  }
}

function exportarClientesCSV(){
  const rows = Array.from(S.clientes.values()).sort((a,b)=> (a.nome||'').localeCompare(b.nome||''));
  const csv = toCSV([
    {key:'codigo', label:'Código'},
    {key:'nome', label:'Nome'},
    {key:'cpf_cnpj', label:'CPF/CNPJ'},
    {key:'rg', label:'RG'},
    {key:'telefone', label:'Telefone'},
    {key:'rua', label:'Rua'},
    {key:'numero', label:'Número'},
    {key:'bairro', label:'Bairro'},
    {key:'cep', label:'CEP'},
    {key:'cidade', label:'Cidade'},
    {key:'estado', label:'UF'},
    {label:'Cadastro', value:c=>fmtDate(c.data_cadastro)},
  ], rows);
  baixarArquivo('clientes-'+todayISO()+'.csv', csv, 'text/csv;charset=utf-8;');
}

function exportarProdutosCSV(){
  const rows = Array.from(S.produtos.values()).sort((a,b)=> (a.descricao||'').localeCompare(b.descricao||''));
  const csv = toCSV([
    {key:'codigo', label:'Código'},
    {key:'descricao', label:'Descrição'},
    {key:'ncm', label:'NCM'},
    {label:'Custo', value:p=>fmtBRL(p.valor_compra)},
    {label:'Venda', value:p=>fmtBRL(p.valor_venda)},
    {label:'Lucro', value:p=>fmtBRL((Number(p.valor_venda)||0)-(Number(p.valor_compra)||0))},
    {label:'Estoque', value:p=> estoqueControlado(p) ? p.estoque : 'não controlado'},
    {key:'estoque_min', label:'Estoque mínimo'},
  ], rows);
  baixarArquivo('produtos-'+todayISO()+'.csv', csv, 'text/csv;charset=utf-8;');
}

function exportarPedidosCSV(){
  const linhas = [];
  Array.from(S.pedidos.values()).sort((a,b)=> (Number(a.numero)||0)-(Number(b.numero)||0)).forEach(p=>{
    (p.itens||[]).forEach(it=>{
      (it.parcelas||[]).forEach(parc=>{
        linhas.push({
          numero: p.numero, data_compra: p.data_compra, cliente: p.cliente_nome, codigo_cliente: p.codigo_cliente,
          forma_pagamento: p.forma_pagamento, produto: it.descricao, codigo_produto: it.codigo_produto,
          uni: it.uni, valor_parcela: it.valor_parcela, parcelaLabel: parc.n+'/'+it.parcelas_qtd,
          data_pgto: parc.data_pgto, recebimento: parc.recebimento,
        });
      });
    });
  });
  const csv = toCSV([
    {key:'numero', label:'Pedido'},
    {label:'Data', value:r=>fmtDate(r.data_compra)},
    {key:'cliente', label:'Cliente'},
    {key:'codigo_cliente', label:'Cód. cliente'},
    {key:'forma_pagamento', label:'Forma pgto.'},
    {key:'produto', label:'Produto'},
    {key:'codigo_produto', label:'Cód. produto'},
    {key:'uni', label:'Uni.'},
    {label:'Valor/parcela', value:r=>fmtBRL(r.valor_parcela)},
    {key:'parcelaLabel', label:'Parcela'},
    {label:'Data pgto.', value:r=> r.data_pgto ? fmtDate(r.data_pgto) : ''},
    {label:'Recebimento', value:r=>fmtBRL(r.recebimento)},
  ], linhas);
  baixarArquivo('pedidos-'+todayISO()+'.csv', csv, 'text/csv;charset=utf-8;');
}

function gerarBackupCompleto(){
  return JSON.stringify({
    sistema: 'Ramos de Oliveira', versao: 1, gerado_em: new Date().toISOString(),
    clientes: Array.from(S.clientes.values()),
    produtos: Array.from(S.produtos.values()),
    pedidos: Array.from(S.pedidos.values()),
  }, null, 2);
}
async function exportarBackupCompleto(){
  await baixarArquivo('backup-ramos-de-oliveira-'+todayISO()+'.json', gerarBackupCompleto(), 'application/json;charset=utf-8;');
}

async function restaurarBackup(obj, statusEl){
  if(!obj || typeof obj!=='object' || (!Array.isArray(obj.clientes) && !Array.isArray(obj.produtos) && !Array.isArray(obj.pedidos))){
    toast('Arquivo de backup inválido.', 'err'); return;
  }
  const totalRegistros = (obj.clientes||[]).length + (obj.produtos||[]).length + (obj.pedidos||[]).length;
  if(!confirm('Restaurar este backup vai sobrescrever os registros com os mesmos códigos já cadastrados ('+totalRegistros+' registro(s) no arquivo). Continuar?')) return;
  if(!S.db){ toast('Sem conexão com o banco de dados nesta visualização.', 'err'); return; }
  let ok=0, fail=0;
  async function restaurarColecao(nome, lista, map, chave){
    for(const item of (lista||[])){
      const id = item && item[chave]!=null ? String(item[chave]) : '';
      if(!id){ fail++; continue; }
      try{ await S.db.collection(nome).doc(id).set(item); map.set(id, item); ok++; }
      catch(e){ console.error('Erro ao restaurar '+nome+' '+id+':', e); fail++; }
      if(statusEl) statusEl.textContent = 'Restaurando… '+(ok+fail)+'/'+totalRegistros;
    }
  }
  await restaurarColecao('clientes', obj.clientes, S.clientes, 'codigo');
  await restaurarColecao('produtos', obj.produtos, S.produtos, 'codigo');
  await restaurarColecao('pedidos', obj.pedidos, S.pedidos, 'numero');
  toast(fail===0 ? ok+' registro(s) restaurado(s).' : ok+' restaurado(s), '+fail+' com erro.', fail===0?'ok':'err');
  render();
}

function renderBackup(el){
  setTitle('Backup', 'Exportação e restauração de dados', backHomeBtn());
  const podeExportar = !!S.downloads;
  el.innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <div class="card-head"><h2>Exportar dados</h2></div>
      <div class="card-body">
        ${!podeExportar ? `<div class="alertbox info">${ICONS.warn}<div>Exportação de arquivos não está disponível nesta visualização.</div></div>` : ''}
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn" id="bkp-clientes" ${podeExportar?'':'disabled'}>${ICONS.upload} Exportar clientes (CSV)</button>
          <button class="btn" id="bkp-produtos" ${podeExportar?'':'disabled'}>${ICONS.upload} Exportar produtos (CSV)</button>
          <button class="btn" id="bkp-pedidos" ${podeExportar?'':'disabled'}>${ICONS.upload} Exportar pedidos (CSV)</button>
        </div>
        <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
          <button class="btn primary" id="bkp-completo" ${podeExportar?'':'disabled'}>${ICONS.upload} Baixar backup completo (JSON)</button>
          <div class="hint" style="margin-top:8px; color:var(--muted); font-size:12px;">O backup completo contém todos os clientes, produtos e pedidos — guarde-o em um lugar seguro para restaurar em caso de perda de dados.</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Restaurar backup</h2></div>
      <div class="card-body">
        <div class="alertbox warning">${ICONS.warn}<div>Restaurar um backup sobrescreve os registros com os mesmos códigos já cadastrados. Use apenas para recuperar dados perdidos.</div></div>
        <input type="file" id="bkp-arquivo" accept="application/json,.json">
        <div id="bkp-status" style="margin-top:10px; font-size:12.5px; color:var(--muted);"></div>
      </div>
    </div>
  `;
  const b1 = document.getElementById('bkp-clientes'); if(b1) b1.onclick = exportarClientesCSV;
  const b2 = document.getElementById('bkp-produtos'); if(b2) b2.onclick = exportarProdutosCSV;
  const b3 = document.getElementById('bkp-pedidos'); if(b3) b3.onclick = exportarPedidosCSV;
  const b4 = document.getElementById('bkp-completo'); if(b4) b4.onclick = exportarBackupCompleto;
  const fileInp = document.getElementById('bkp-arquivo');
  const statusEl = document.getElementById('bkp-status');
  if(fileInp) fileInp.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    statusEl.textContent = 'Lendo arquivo…';
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const obj = JSON.parse(reader.result);
        await restaurarBackup(obj, statusEl);
      }catch(err){
        toast('Arquivo inválido: '+err.message, 'err');
      }
      statusEl.textContent = '';
      fileInp.value = '';
    };
    reader.readAsText(file);
  };
}

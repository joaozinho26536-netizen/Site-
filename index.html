<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramos de Oliveira &middot; Painel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Roboto+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props">
<link rel="icon" href="assets/img/favicon.png?v=1" type="image/png">
<link rel="apple-touch-icon" href="assets/img/favicon.png?v=1">
<link rel="stylesheet" href="assets/style.css?v=5">
</head><body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js?v=5"></script>
<script src="assets/nav.js?v=5"></script>
<script>
(async function(){
  const session = await RO.requireAuth();
  if(!session) return;
  const perfil = await RO.getMeuPerfil();
  const isAdmin = !!(perfil && perfil.role === 'admin_chefe');
  RO_NAV.mount('home', perfil);
  RO_NAV.setTitle('Início', 'Visão geral do sistema', '');

  const el = document.getElementById('content');
  el.innerHTML = RO.skeletonKpiRow(3, true) + RO.skeletonKpiRow(4) + RO.skeletonKpiRow(4);

  let clientes, produtos, pedidos;
  try{
    [clientes, produtos, pedidos] = await Promise.all([RO.loadClientes(), RO.loadProdutos(), RO.loadPedidos()]);
  }catch(e){
    el.innerHTML = '<div class="empty">'+RO_NAV.ICONS.warn+'<div>Erro ao carregar dados: '+RO.esc(e.message)+'</div></div>';
    return;
  }
  const clientesMap = new Map(clientes.map(c=>[c.codigo,c]));

  const now = new Date();
  const ym = now.toISOString().slice(0,7);
  let pedidosMes = 0, vendasMes = 0;
  pedidos.forEach(p=>{
    if((p.data_compra||'').slice(0,7) === ym){
      pedidosMes++;
      (p.itens||[]).forEach(it=> vendasMes += (Number(it.valor_venda)||0) * (Number(it.uni)||1));
    }
  });
  const baixoEstoque = produtos.filter(RO.estoqueBaixo);
  const receberLinhas = RO.listaContasAReceber(pedidos, clientesMap);
  const totalReceber = receberLinhas.reduce((s,l)=> s+l.valor, 0);
  const vencidasLinhas = receberLinhas.filter(l=>l.vencida);

  el.innerHTML = `
    <div class="kpi-row">
      <div class="kpi kpi-hero"><div class="label">Vendas neste mês</div><div class="value">${RO.fmtBRL(vendasMes)}</div><div class="sub">${now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})} &middot; valor de venda dos pedidos</div></div>
      <div class="kpi"><div class="label">Pedidos neste mês</div><div class="value">${pedidosMes}</div><div class="sub">emitidos no mês</div></div>
      <div class="kpi"><div class="label">A receber</div><div class="value">${RO.fmtBRL(totalReceber)}</div><div class="sub">parcelas em aberto</div></div>
    </div>
    <div class="kpi-row" style="margin-top:14px;">
      <div class="kpi"><div class="label">Clientes cadastrados</div><div class="value">${clientes.length}</div><div class="sub">base de clientes</div></div>
      <div class="kpi"><div class="label">Produtos no catálogo</div><div class="value">${produtos.length}</div><div class="sub">itens ativos</div></div>
      <div class="kpi${vencidasLinhas.length?' kpi-alert':''}"><div class="label">Parcelas vencidas</div><div class="value">${vencidasLinhas.length}</div><div class="sub">${RO.fmtBRL(vencidasLinhas.reduce((s,l)=>s+l.valor,0))} em atraso</div></div>
      <div class="kpi${baixoEstoque.length?' kpi-alert':''}"><div class="label">Estoque baixo</div><div class="value">${baixoEstoque.length}</div><div class="sub">produto(s) no ponto de repor</div></div>
    </div>

    <div class="home-section-label">Acessar</div>
    <div class="tile-grid">
      <a class="tile" href="clientes.html">${RO_NAV.ICONS.users}<span class="lbl">Clientes</span></a>
      <a class="tile" href="produtos.html">${RO_NAV.ICONS.box}<span class="lbl">Produtos</span></a>
      <a class="tile" href="vendas.html">${RO_NAV.ICONS.file}<span class="lbl">Vendas</span></a>
      ${isAdmin ? `<a class="tile" href="financeiro.html">${RO_NAV.ICONS.coins}<span class="lbl">Financeiro</span></a>` : ''}
      ${isAdmin ? `<a class="tile" href="backup.html">${RO_NAV.ICONS.upload}<span class="lbl">Backup</span></a>` : ''}
    </div>
  `;
})();
</script>
</body></html>
